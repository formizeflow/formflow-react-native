name: Release
on:
  push: { tags: ["v*"] }
permissions: { contents: read }
jobs:
  release:
    runs-on: ubuntu-latest
    permissions: { contents: write, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - name: Tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test --if-present
      - run: npm run build --if-present
      - run: npm pack
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with: { subject-path: "*.tgz" }
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" *.tgz --generate-notes --verify-tag
        env: { GH_TOKEN: "${{ github.token }}" }
      # Turn on after adding this repo as a trusted publisher on npmjs.com (repo variable NPM_PUBLISH=true).
      - name: Publish to npm with provenance (trusted publishing, no token)
        if: vars.NPM_PUBLISH == 'true'
        run: |
          npm install -g npm@11
          npm publish ./*.tgz --provenance --access public
